    <g>
      <rect x="470" y="70" width="672" height="470" rx="18" fill="#161b22" fill-opacity="0.6" stroke="rgba(240,246,252,0.1)"/>
      <rect x="470" y="70" width="672" height="46" rx="18" fill="#161b22" fill-opacity="0.7"/>
      <circle cx="496" cy="93" r="5" fill="#ef4444"/><circle cx="516" cy="93" r="5" fill="#eab308"/><circle cx="536" cy="93" r="5" fill="#22c55e"/>
      <text x="806" y="97" fill="#8b949e" font-size="12" text-anchor="middle" letter-spacing="1">ivan — zsh</text>

      <text x="504" y="158" fill="#e6edf3" font-size="26" font-weight="700">Hi <tspan font-size="24">👋</tspan> I'm <tspan fill="url(#accent)">Ivan Sukhachev</tspan></text>

