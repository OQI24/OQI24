          <text x="504" y="256"><tspan fill="#a371f7">🎓 Education</tspan>  <tspan fill="#e6edf3">Control Systems Eng · ROAT</tspan></text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
          <text x="504" y="282"><tspan fill="#d2a8ff">⚡ Focus</tspan>      <tspan fill="#e6edf3">Frontend · AI Engineering · Automation</tspan></text></g>
        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/>
          <text x="504" y="308"><tspan fill="#8957e5">💬 Contact</tspan>   <tspan fill="#e6edf3">t.me/ivan_sukhachev</tspan></text></g>
      </g>

      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.0s" fill="freeze"/>
        <text x="504" y="344" fill="#6e7681" font-size="12" letter-spacing="2">SKILLS</text>
        <g font-size="12.5" fill="#e6edf3" text-anchor="middle">
          <g><rect x="504" y="354" width="86" height="26" rx="13" fill="url(#pillGrad)" stroke="#a371f7" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/></rect><text x="547" y="371">TypeScript</text></g>
          <g><rect x="598" y="354" width="60" height="26" rx="13" fill="url(#pillGrad)" stroke="#8957e5" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.3s" repeatCount="indefinite"/></rect><text x="628" y="371">React</text></g>
          <g><rect x="666" y="354" width="66" height="26" rx="13" fill="url(#pillGrad)" stroke="#d2a8ff" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/></rect><text x="699" y="371">Node.js</text></g>
          <g><rect x="740" y="354" width="72" height="26" rx="13" fill="url(#pillGrad)" stroke="#a371f7" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.1s" repeatCount="indefinite"/></rect><text x="776" y="371">GraphQL</text></g>
          <g><rect x="820" y="354" width="60" height="26" rx="13" fill="url(#pillGrad)" stroke="#8957e5" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.6s" repeatCount="indefinite"/></rect><text x="850" y="371">Redux</text></g>
          <g><rect x="504" y="388" width="58" height="26" rx="13" fill="url(#pillGrad)" stroke="#d2a8ff" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.4s" repeatCount="indefinite"/></rect><text x="533" y="405">MobX</text></g>
          <g><rect x="570" y="388" width="66" height="26" rx="13" fill="url(#pillGrad)" stroke="#a371f7" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.9s" repeatCount="indefinite"/></rect><text x="603" y="405">Express</text></g>
          <g><rect x="644" y="388" width="64" height="26" rx="13" fill="url(#pillGrad)" stroke="#8957e5" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.2s" repeatCount="indefinite"/></rect><text x="676" y="405">Docker</text></g>
          <g><rect x="716" y="388" width="72" height="26" rx="13" fill="url(#pillGrad)" stroke="#d2a8ff" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.7s" repeatCount="indefinite"/></rect><text x="752" y="405">Webpack</text></g>
          <g><rect x="796" y="388" width="42" height="26" rx="13" fill="url(#pillGrad)" stroke="#a371f7" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/></rect><text x="817" y="405">NX</text></g>
          <g><rect x="504" y="422" width="86" height="26" rx="13" fill="url(#pillGrad)" stroke="#8957e5" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/></rect><text x="547" y="439">Single-SPA</text></g>
          <g><rect x="598" y="422" width="46" height="26" rx="13" fill="url(#pillGrad)" stroke="#d2a8ff" stroke-opacity="0.4"><animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="3.1s" repeatCount="indefinite"/></rect><text x="621" y="439">Git</text></g>
