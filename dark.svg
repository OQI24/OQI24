        <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
          <text x="504" y="230"><tspan fill="#8957e5">📍 Location</tspan>   <tspan fill="#e6edf3">Moscow, RU</tspan></text></g>
