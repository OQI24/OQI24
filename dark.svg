<svg width="1180" height="610" viewBox="0 0 1180 610" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#d2a8ff"/>
    </linearGradient>

    <linearGradient id="asciiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a371f7">
        <animate attributeName="stop-color" values="#a371f7;#8957e5;#d2a8ff;#a371f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8957e5">
        <animate attributeName="stop-color" values="#8957e5;#d2a8ff;#a371f7;#8957e5" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d2a8ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="glassReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a371f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a371f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>

    <clipPath id="cardClip"><rect x="0" y="0" width="1180" height="610" rx="26"/></clipPath>
    <clipPath id="asciiClip"><rect x="40" y="120" width="360" height="400" rx="14"/></clipPath>

    <mask id="asciiReveal">
      <rect x="0" y="0" width="448" height="120" fill="#fff">
        <animate attributeName="height" values="120;120;520" keyTimes="0;0.12;1" dur="3.2s" fill="freeze"/>
      </rect>
    </mask>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1180" height="610" fill="#0d1117"/>

    <g filter="url(#bigBlur)">
      <circle r="150" fill="url(#glowPurple)">
        <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="200;420;200" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="170" fill="url(#glowBlue)">
        <animate attributeName="cx" values="900;720;900" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="180;460;180" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle r="140" fill="url(#glowEmerald)">
        <animate attributeName="cx" values="600;760;600" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="520;300;520" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1180" height="610" filter="url(#noise)" opacity="0.5"/>

    <g fill="#a371f7">
      <circle cx="120" cy="90"  r="1.6" opacity="0.6"><animate attributeName="cy" values="90;70;90" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="130" r="1.4" opacity="0.5"><animate attributeName="cy" values="130;110;130" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.7;0.1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="500" r="1.8" opacity="0.5"><animate attributeName="cy" values="500;480;500" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.7;0.2" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="540" r="1.3" opacity="0.4"><animate attributeName="cy" values="540;520;540" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.1;0.6;0.1" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="150" r="1.5" opacity="0.5"><animate attributeName="cy" values="150;134;150" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.7;0.15" dur="6.5s" repeatCount="indefinite"/></circle>
    </g>

    <rect width="1180" height="610" fill="url(#glassReflect)"/>

    <!-- LEFT: NAME / MONOGRAM PANEL -->
    <g>
      <rect x="40" y="70" width="360" height="470" rx="18" fill="#161b22" fill-opacity="0.55" stroke="rgba(240,246,252,0.1)"/>
      <rect x="40" y="70" width="360" height="46" rx="18" fill="#161b22" fill-opacity="0.6"/>
      <circle cx="66" cy="93" r="5" fill="#ef4444"/><circle cx="86" cy="93" r="5" fill="#eab308"/><circle cx="106" cy="93" r="5" fill="#22c55e"/>
      <text x="200" y="97" fill="#8b949e" font-size="12" text-anchor="middle" letter-spacing="1">~/ivan.sukhachev</text>

      <g clip-path="url(#asciiClip)">
        <g fill="url(#asciiGrad)" font-size="13" filter="url(#softGlow)" letter-spacing="0.5">
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
          <g mask="url(#asciiReveal)">
            <text x="78" y="170">  ###  #     #    #    #    #</text>
            <text x="78" y="190">   #   #     #   # #   ##   #</text>
            <text x="78" y="210">   #   #     #  #   #  # #  #</text>
            <text x="78" y="230">   #    #   #   #####  #  # #</text>
            <text x="78" y="250">   #     # #    #   #  #   ##</text>
            <text x="78" y="270">  ###     #     #   #  #    #</text>
            <text x="78" y="310">  +------------------------+</text>
            <text x="78" y="330">  |     S U K H A C H E V  |</text>
            <text x="78" y="350">  +------------------------+</text>
            <text x="78" y="390">  frontend · systems · craft</text>
            <text x="78" y="420">  &gt; build()</text>
            <text x="78" y="440">  &gt; ship()</text>
            <text x="78" y="460">  &gt; iterate()</text>
            <text x="78" y="490">  OQI24 · Moscow</text>
          </g>
        </g>
        <rect x="40" y="120" width="360" height="26" fill="#a371f7" opacity="0.10">
          <animate attributeName="y" values="120;480;120" dur="4s" repeatCount="indefinite"/>
        </rect>
        <rect x="168" y="448" width="9" height="13" fill="#a371f7">
          <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
        </rect>
